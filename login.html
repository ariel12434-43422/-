<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Sign in — Twelve Steps Pro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <script src="assets/js/tailwind-theme.js"></script>
  <script src="assets/js/auth.js"></script>
</head>
<body class="bg-cream text-ink font-sans antialiased min-h-screen flex flex-col">
  <header class="max-w-content w-full mx-auto px-5 h-16 flex items-center">
    <a href="index.html" class="font-serif text-lg font-semibold tracking-tight">Twelve Steps <span class="text-sage">Pro</span></a>
  </header>

  <main class="flex-1 flex items-center justify-center px-5 pb-20">
    <div class="w-full max-w-sm">
      <h1 class="font-serif text-3xl tracking-tight text-center">Welcome back</h1>
      <p class="mt-3 text-center text-ink-600 text-sm">Enter the email you used at checkout. We'll send you a secure sign-in link.</p>

      <form id="login-form" class="mt-10 space-y-4">
        <label class="block">
          <span class="text-sm font-medium">Email</span>
          <input id="email" type="email" required autocomplete="email" placeholder="you@practice.com"
            class="mt-2 w-full rounded-xl border border-cream-200 bg-white px-4 py-3 outline-none focus:border-sage focus:ring-2 focus:ring-sage/20" />
        </label>
        <button class="w-full bg-ink text-cream rounded-full py-3.5 font-medium hover:bg-ink-600 transition">Send sign-in link</button>
      </form>

      <!-- DEV ONLY: remove once Supabase magic-link auth is wired up -->
      <div class="mt-10 rounded-2xl border border-dashed border-clay/40 bg-clay-100/40 p-4 text-xs text-ink-600">
        <p class="font-medium text-clay">Development mode</p>
        <p class="mt-1">Sign-in is simulated locally. Choose a plan to preview:</p>
        <label class="mt-3 flex items-center gap-2"><input type="radio" name="plan" value="course" checked /> Course ($99)</label>
        <label class="mt-1 flex items-center gap-2"><input type="radio" name="plan" value="pro" /> Pro Bundle ($199)</label>
      </div>

      <p class="mt-8 text-center text-sm text-ink-400">Not enrolled yet? <a href="index.html#pricing" class="text-sage underline underline-offset-4">See pricing</a></p>
    </div>
  </main>

  <script>
    if (Auth.getSession()) window.location.replace('dashboard.html');

    document.getElementById('login-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const plan = document.querySelector('input[name="plan"]:checked').value;
      Auth.signIn(email, plan);
      window.location.href = 'dashboard.html';
    });
  </script>
</body>
</html>
