<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Certificate of Completion — Twelve Steps Pro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <script src="assets/js/tailwind-theme.js"></script>
  <script src="assets/js/site-config.js"></script>
  <script src="assets/js/course-data.js"></script>
  <script src="assets/js/auth.js"></script>
  <script>
    Auth.requireSession();
    if (Progress.completed().size < COURSE_STEPS.length) location.replace('dashboard.html');
  </script>
  <style>
    @page { size: A4 landscape; margin: 0; }
    @media print {
      .no-print { display: none !important; }
      body { background: #fff; }
      #certificate { box-shadow: none; margin: 0; width: 100%; }
    }
  </style>
</head>
<body class="bg-cream-100 text-ink font-sans antialiased min-h-screen">
  <div class="no-print max-w-5xl mx-auto px-5 pt-8 flex flex-wrap items-end justify-between gap-4">
    <a href="dashboard.html" class="text-sm text-ink-600 hover:text-ink">← Back to course</a>
    <form id="name-form" class="flex items-end gap-3">
      <label class="block">
        <span class="text-xs text-ink-600">Name as it should appear</span>
        <input id="name-input" required class="mt-1 block rounded-xl border border-cream-200 bg-white px-4 py-2.5 outline-none focus:border-sage" />
      </label>
      <button class="bg-ink text-cream px-5 py-2.5 rounded-full text-sm font-medium">Update</button>
      <button type="button" onclick="window.print()" class="bg-sage text-cream px-5 py-2.5 rounded-full text-sm font-medium">Download PDF</button>
    </form>
  </div>

  <div class="max-w-5xl mx-auto px-5 py-8">
    <div id="certificate" class="aspect-[297/210] bg-white shadow-xl rounded-sm p-[4%] relative">
      <div class="h-full w-full border-2 border-sage/70 p-[1.2%]">
        <div class="h-full w-full border border-sage/30 flex flex-col items-center justify-center text-center px-[8%]">
          <p class="text-[clamp(0.6rem,1.3vw,0.85rem)] font-medium uppercase tracking-[0.3em] text-sage">Certificate of Completion</p>
          <p class="mt-[3%] text-[clamp(0.7rem,1.5vw,1rem)] text-ink-600">This certifies that</p>
          <p id="cert-name" class="font-serif text-[clamp(1.6rem,5vw,3.5rem)] leading-tight mt-[1.5%]"></p>
          <div class="h-px w-1/3 bg-ink/20 mt-[2%]"></div>
          <p class="mt-[3%] text-[clamp(0.7rem,1.5vw,1rem)] text-ink-600 max-w-xl">
            has successfully completed all twelve lessons of
            <span id="cert-course" class="font-serif italic text-ink"></span>
            <span id="cert-pro"></span>
          </p>
          <div class="mt-[6%] w-full grid grid-cols-3 items-end text-[clamp(0.55rem,1.1vw,0.8rem)] text-ink-600">
            <div>
              <p id="cert-date" class="font-medium text-ink"></p>
              <div class="h-px bg-ink/20 my-2 mx-[15%]"></div>
              <p>Date</p>
            </div>
            <div class="flex justify-center">
              <div class="h-[clamp(3rem,8vw,5.5rem)] w-[clamp(3rem,8vw,5.5rem)] rounded-full border-2 border-clay/70 flex items-center justify-center font-serif text-clay text-[clamp(0.9rem,2.2vw,1.6rem)]">12</div>
            </div>
            <div>
              <p class="font-serif italic text-ink text-[clamp(0.9rem,1.8vw,1.3rem)]" id="cert-instructor"></p>
              <div class="h-px bg-ink/20 my-2 mx-[15%]"></div>
              <p>Instructor</p>
            </div>
          </div>
          <p class="mt-[4%] text-[clamp(0.5rem,0.9vw,0.7rem)] text-ink-400">Certificate ID: <span id="cert-id"></span></p>
        </div>
      </div>
    </div>
  </div>

  <script>
    // DEV STUB: production issues the certificate server-side (stored ID + public
    // verification URL) when the 12th lesson is completed. See README.
    const session = Auth.getSession();
    const CERT_KEY = 'course.certificate';
    const load = () => { try { return JSON.parse(localStorage.getItem(CERT_KEY)); } catch { return null; } };
    const save = (c) => { try { localStorage.setItem(CERT_KEY, JSON.stringify(c)); } catch {} };

    let cert = load();
    if (!cert) {
      cert = {
        id: 'TSP-' + crypto.randomUUID().slice(0, 8).toUpperCase(),
        issuedAt: new Date().toISOString(),
        name: session.email.split('@')[0],
      };
      save(cert);
    }

    function render() {
      document.getElementById('cert-name').textContent = cert.name;
      document.getElementById('name-input').value = cert.name;
      document.getElementById('cert-course').textContent = SITE.courseName;
      document.getElementById('cert-pro').textContent = session.plan === 'pro' ? '— Certified Practitioner Track.' : '.';
      document.getElementById('cert-instructor').textContent = SITE.instructor;
      document.getElementById('cert-id').textContent = cert.id;
      document.getElementById('cert-date').textContent = new Date(cert.issuedAt)
        .toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
    }

    document.getElementById('name-form').addEventListener('submit', (e) => {
      e.preventDefault();
      cert.name = document.getElementById('name-input').value.trim() || cert.name;
      save(cert);
      render();
    });

    render();
  </script>
</body>
</html>
