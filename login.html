<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Sign in — Twelve Steps Pro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Inter+Tight:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/site.css" />
  <meta name="theme-color" content="#000000" />
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <script src="assets/js/tailwind-theme.js"></script>
  <script src="assets/js/auth.js"></script>
</head>
<body class="bg-night text-mist font-sans antialiased min-h-screen flex flex-col relative">
  <div class="cinema grain fixed inset-0 -z-10 opacity-60"></div>
  <header class="max-w-content w-full mx-auto px-5 md:px-8 h-20 flex items-center">
    <a href="index.html" class="font-display font-extrabold text-lg md:text-xl tracking-tight uppercase">Twelve<span class="text-accent">Steps</span> Pro</a>
  </header>

  <main class="flex-1 flex items-center justify-center px-5 pb-20">
    <div class="w-full max-w-md bg-black/80 backdrop-blur border border-night-700 rounded-lg p-8 md:p-10">
      <h1 class="font-display font-bold text-3xl tracking-tight text-center">Log In</h1>
      <p class="mt-3 text-center text-mist-400 text-sm">Enter the email you used at checkout. We'll send you a secure sign-in link.</p>

      <form id="login-form" class="mt-10 space-y-4">
        <label class="block">
          <span class="text-xs font-semibold uppercase tracking-wider text-mist-400">Email</span>
          <input id="email" type="email" required autocomplete="email" placeholder="you@practice.com"
            class="mt-2 w-full rounded bg-night-800 border border-night-500 px-4 py-3.5 text-mist placeholder:text-mist-500 outline-none focus:border-mist" />
        </label>
        <button class="w-full bg-accent hover:bg-accent-600 text-white rounded py-4 font-semibold transition">Send Sign-In Link</button>
      </form>

      <!-- DEV ONLY: remove once Supabase magic-link auth is wired up -->
      <div class="mt-10 rounded border border-dashed border-night-500 p-4 text-xs text-mist-400">
        <p class="font-semibold text-accent">Development mode</p>
        <p class="mt-1">Sign-in is simulated locally. Choose a plan to preview:</p>
        <label class="mt-3 flex items-center gap-2"><input type="radio" name="plan" value="course" checked class="accent-[#E3193B]" /> Course ($99)</label>
        <label class="mt-1 flex items-center gap-2"><input type="radio" name="plan" value="pro" class="accent-[#E3193B]" /> Pro Bundle ($199)</label>
      </div>

      <p class="mt-8 text-center text-sm text-mist-500">Not enrolled yet? <a href="index.html#pricing" class="text-mist font-semibold hover:underline underline-offset-4">See pricing</a></p>
    </div>
  </main>

  <script>
    if (Auth.getSession()) window.location.replace('dashboard.html');

    document.getElementById('login-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const plan = document.querySelector('input[name="plan"]:checked').value;
      Auth.signIn(email, plan);
      window.location.href = 'dashboard.html';
    });
  </script>
</body>
</html>
