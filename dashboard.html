<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#000000" />
  <title>My Class — Twelve Steps Pro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Inter+Tight:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/site.css" />
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <script src="assets/js/tailwind-theme.js"></script>
  <script src="assets/js/site-config.js"></script>
  <script src="assets/js/course-data.js"></script>
  <script src="assets/js/auth.js"></script>
  <script>Auth.requireSession();</script>
</head>
<body class="bg-night text-mist font-sans antialiased">

  <header class="sticky top-0 z-40 bg-black/95 backdrop-blur border-b border-night-700">
    <div class="max-w-[100rem] mx-auto px-5 md:px-8 h-16 flex items-center justify-between gap-6">
      <a href="index.html" class="font-display font-extrabold text-lg tracking-tight uppercase shrink-0">Twelve<span class="text-accent">Steps</span> Pro</a>
      <div class="hidden sm:flex items-center gap-4 flex-1 max-w-md">
        <div class="h-1 flex-1 rounded-full bg-night-600 overflow-hidden">
          <div id="progress-bar" class="h-full bg-accent rounded-full transition-all duration-500" style="width:0%"></div>
        </div>
        <span id="progress-label" class="text-xs font-semibold text-mist-300 tabular-nums whitespace-nowrap">0 / 12</span>
      </div>
      <div class="flex items-center gap-5 text-sm">
        <span id="plan-badge" class="hidden md:inline text-[11px] font-bold uppercase tracking-wider px-2.5 py-1 rounded"></span>
        <span id="user-email" class="hidden lg:inline text-mist-500"></span>
        <button id="sign-out" class="font-semibold text-mist-300 hover:text-mist">Sign Out</button>
      </div>
    </div>
  </header>

  <div class="max-w-[100rem] mx-auto lg:grid lg:grid-cols-[1fr_24rem]">

    <!-- Player + lesson details -->
    <main class="lg:border-r border-night-700 min-w-0">
      <div id="player" class="aspect-video w-full bg-black"></div>

      <div class="px-5 md:px-8 py-8">
        <div class="flex flex-col md:flex-row md:items-start md:justify-between gap-6">
          <div>
            <p id="lesson-kicker" class="text-xs font-semibold uppercase tracking-eyebrow text-mist-500"></p>
            <h1 id="lesson-title" class="font-display font-bold text-3xl md:text-4xl tracking-tight mt-2"></h1>
            <p id="lesson-summary" class="mt-3 text-mist-400 leading-relaxed max-w-2xl"></p>
          </div>
          <div class="flex gap-3 shrink-0">
            <button id="toggle-complete" class="px-5 py-3 rounded font-semibold text-sm transition"></button>
            <button id="next-lesson" class="px-5 py-3 rounded font-semibold text-sm bg-white/10 hover:bg-white/20 transition">Next Lesson →</button>
          </div>
        </div>

        <!-- Resources -->
        <h2 class="mt-12 text-xs font-semibold uppercase tracking-eyebrow text-mist-500">Class materials</h2>
        <section class="mt-4 grid md:grid-cols-3 gap-3">
          <a id="workbook-link" download class="group rounded-lg bg-night-800 border border-night-600 p-5 hover:border-mist-500 transition">
            <p class="text-[11px] font-bold uppercase tracking-wider text-mist-500">Workbook · PDF</p>
            <p class="mt-2 font-semibold">Step workbook</p>
            <p class="mt-1 text-sm text-mist-400">Exercises and prompts for this step.</p>
            <p class="mt-4 text-sm font-semibold group-hover:text-accent transition">Download ↓</p>
          </a>
          <div id="pro-resources" class="md:col-span-2 grid sm:grid-cols-2 gap-3"></div>
        </section>

        <!-- Certificate + community -->
        <section class="mt-3 grid md:grid-cols-2 gap-3">
          <div id="certificate-card" class="rounded-lg p-6 border"></div>
          <div class="rounded-lg border border-dashed border-night-500 p-6">
            <p class="text-[11px] font-bold uppercase tracking-wider text-mist-500">Coming soon</p>
            <p class="mt-2 font-semibold">Community & monthly live sessions</p>
            <p class="mt-1 text-sm text-mist-400">Live Q&A and case consultations with Tim. We'll let you know when doors open.</p>
          </div>
        </section>
      </div>
    </main>

    <!-- Lesson list -->
    <aside class="border-t lg:border-t-0 border-night-700">
      <div class="lg:sticky lg:top-16 lg:max-h-[calc(100vh-4rem)] lg:overflow-y-auto">
        <div class="px-5 md:px-6 py-5 flex items-center justify-between border-b border-night-700">
          <h2 class="font-display font-bold text-lg">Lessons</h2>
          <span id="lessons-count" class="text-xs text-mist-500"></span>
        </div>
        <ol id="step-nav" class="py-2"></ol>
      </div>
    </aside>
  </div>

  <script>
    const session = Auth.getSession();
    const isPro = session?.plan === 'pro';
    const pad = (n) => String(n).padStart(2, '0');
    let current = Number(new URLSearchParams(location.search).get('step')) || null;

    document.getElementById('user-email').textContent = session?.email ?? '';
    const badge = document.getElementById('plan-badge');
    badge.textContent = isPro ? 'Pro' : 'Course';
    badge.className += isPro ? ' bg-accent text-white' : ' bg-white/10 text-mist-300';
    document.getElementById('sign-out').onclick = () => { Auth.signOut(); location.href = 'index.html'; };

    function firstIncomplete(done) {
      return COURSE_STEPS.find((s) => !done.has(s.id))?.id ?? 1;
    }

    function renderNav(done) {
      document.getElementById('lessons-count').textContent = `${done.size} of ${COURSE_STEPS.length} complete`;
      document.getElementById('step-nav').innerHTML = COURSE_STEPS.map((s) => {
        const active = s.id === current;
        const complete = done.has(s.id);
        return `
          <li>
            <a href="?step=${s.id}" data-step="${s.id}"
               class="flex gap-4 px-5 md:px-6 py-3 transition ${active ? 'bg-night-700' : 'hover:bg-night-800'}">
              <span class="relative w-28 shrink-0 aspect-video rounded overflow-hidden cinema" style="--img: url('${s.thumbnail}');">
                <span class="absolute inset-0 flex items-center justify-center font-display font-extrabold text-2xl text-white/25">${pad(s.id)}</span>
                ${active ? '<span class="absolute inset-0 ring-2 ring-inset ring-accent rounded"></span>' : ''}
                ${complete ? '<span class="absolute bottom-1 right-1 h-5 w-5 rounded-full bg-accent text-white text-[10px] flex items-center justify-center">✓</span>' : ''}
              </span>
              <span class="min-w-0 py-0.5">
                <span class="block text-[11px] font-semibold uppercase tracking-wider ${active ? 'text-accent' : 'text-mist-500'}">Lesson ${s.id}</span>
                <span class="block font-semibold text-sm mt-0.5 ${active ? 'text-mist' : 'text-mist-300'}">${s.title}</span>
                <span class="block text-xs text-mist-500 mt-1">${s.duration ?? (s.videoId ? '' : 'Coming soon')}</span>
              </span>
            </a>
          </li>`;
      }).join('');
    }

    function renderPlayer(step) {
      const el = document.getElementById('player');
      if (step.videoId && SITE.video.libraryId) {
        // Production: the token + expires params must come from a server function
        // (Bunny token authentication) so the embed can't be shared.
        el.innerHTML = `<iframe src="https://iframe.mediadelivery.net/embed/${SITE.video.libraryId}/${step.videoId}?autoplay=false&preload=true"
          class="w-full h-full" loading="lazy" allow="accelerometer; gyroscope; encrypted-media; picture-in-picture" allowfullscreen></iframe>`;
      } else {
        el.innerHTML = `
          <div class="relative h-full w-full cinema grain" style="--img: url('${step.thumbnail}');">
            <div class="absolute inset-0 bg-black/50"></div>
            <div class="relative h-full flex flex-col items-center justify-center text-center p-8">
              <p class="text-xs font-semibold uppercase tracking-eyebrow text-accent">Lesson ${step.id}</p>
              <p class="font-display font-extrabold uppercase text-3xl md:text-5xl tracking-tight mt-3">${step.title}</p>
              <p class="mt-4 text-sm text-mist-400">This lesson is being recorded. It will appear here once published.</p>
            </div>
          </div>`;
      }
    }

    function resourceCard({ label, title, desc, href, locked }) {
      if (locked) {
        const upgrade = SITE.checkout.upgradeToPro || 'index.html#pricing';
        return `
          <a href="${upgrade}" class="group rounded-lg bg-night-900 border border-night-600 p-5 hover:border-accent transition">
            <p class="text-[11px] font-bold uppercase tracking-wider text-accent">🔒 Pro Bundle</p>
            <p class="mt-2 font-semibold text-mist-300">${title}</p>
            <p class="mt-1 text-sm text-mist-500">${desc}</p>
            <p class="mt-4 text-sm font-semibold text-accent">Upgrade to unlock →</p>
          </a>`;
      }
      return `
        <a href="${href}" download class="group rounded-lg bg-night-800 border border-night-600 p-5 hover:border-accent transition">
          <p class="text-[11px] font-bold uppercase tracking-wider text-accent">${label}</p>
          <p class="mt-2 font-semibold">${title}</p>
          <p class="mt-1 text-sm text-mist-400">${desc}</p>
          <p class="mt-4 text-sm font-semibold group-hover:text-accent transition">Download ↓</p>
        </a>`;
    }

    function renderCertificate(done) {
      const card = document.getElementById('certificate-card');
      const total = COURSE_STEPS.length;
      if (done.size === total) {
        card.className = 'rounded-lg p-6 border bg-accent border-accent text-white';
        card.innerHTML = `
          <p class="text-[11px] font-bold uppercase tracking-wider text-white/70">Certificate</p>
          <p class="mt-2 font-display font-bold text-2xl">You've completed all twelve steps.</p>
          <a href="certificate.html" class="mt-5 inline-block bg-white text-black px-5 py-2.5 rounded text-sm font-semibold hover:bg-mist-300 transition">View Certificate</a>`;
      } else {
        const left = total - done.size;
        card.className = 'rounded-lg p-6 border bg-night-800 border-night-600';
        card.innerHTML = `
          <p class="text-[11px] font-bold uppercase tracking-wider text-mist-500">Certificate</p>
          <p class="mt-2 font-semibold">Certificate of completion</p>
          <p class="mt-1 text-sm text-mist-400">Complete ${left} more lesson${left === 1 ? '' : 's'} to unlock your certificate.</p>`;
      }
    }

    function render() {
      const done = Progress.completed();
      if (!current) current = firstIncomplete(done);
      const step = COURSE_STEPS.find((s) => s.id === current) ?? COURSE_STEPS[0];
      const pct = Math.round((done.size / COURSE_STEPS.length) * 100);

      document.getElementById('progress-bar').style.width = `${pct}%`;
      document.getElementById('progress-label').textContent = `${done.size} / ${COURSE_STEPS.length}`;
      document.getElementById('lesson-kicker').textContent = `Lesson ${step.id} of ${COURSE_STEPS.length}${step.duration ? ' · ' + step.duration : ''}`;
      document.getElementById('lesson-title').textContent = step.title;
      document.getElementById('lesson-summary').textContent = step.summary;
      document.getElementById('workbook-link').href = step.workbook;

      const btn = document.getElementById('toggle-complete');
      const isDone = done.has(step.id);
      btn.textContent = isDone ? '✓ Completed' : 'Mark as Complete';
      btn.className = `px-5 py-3 rounded font-semibold text-sm transition ${isDone ? 'bg-accent-soft text-accent' : 'bg-accent text-white hover:bg-accent-600'}`;

      document.getElementById('next-lesson').classList.toggle('invisible', step.id === COURSE_STEPS.length);

      document.getElementById('pro-resources').innerHTML =
        resourceCard({ label: 'Pro · PDF', title: 'Extended workbook', desc: 'Case studies and clinical notes.', href: step.proWorkbook, locked: !isPro }) +
        resourceCard({ label: 'Pro · Slides', title: 'Slide deck', desc: 'Ready-to-present slides for groups.', href: step.proSlides, locked: !isPro });

      renderNav(done);
      renderPlayer(step);
      renderCertificate(done);
    }

    function go(stepId) {
      current = stepId;
      history.pushState({}, '', `?step=${stepId}`);
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    document.getElementById('step-nav').addEventListener('click', (e) => {
      const link = e.target.closest('[data-step]');
      if (!link) return;
      e.preventDefault();
      go(Number(link.dataset.step));
    });

    document.getElementById('toggle-complete').onclick = () => {
      Progress.completed().has(current) ? Progress.markIncomplete(current) : Progress.markComplete(current);
      render();
    };
    document.getElementById('next-lesson').onclick = () => go(Math.min(current + 1, COURSE_STEPS.length));
    window.addEventListener('popstate', () => {
      current = Number(new URLSearchParams(location.search).get('step')) || null;
      render();
    });

    render();
  </script>
</body>
</html>
